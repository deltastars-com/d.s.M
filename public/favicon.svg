<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a8c2e"/>
      <stop offset="50%" style="stop-color:#2db846"/>
      <stop offset="100%" style="stop-color:#1a8c2e"/>
    </linearGradient>
    <linearGradient id="darkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d5c1a"/>
      <stop offset="100%" style="stop-color:#1a8c2e"/>
    </linearGradient>
  </defs>
  <!-- White rounded background -->
  <rect width="512" height="512" rx="96" fill="#ffffff"/>
  <!-- DS Letters with leaf styling -->
  <text x="256" y="280" text-anchor="middle" font-family="Georgia, serif" font-weight="900" font-size="200" fill="url(#green)" letter-spacing="-5" font-style="italic">DS</text>
  <!-- Leaf on D -->
  <ellipse cx="185" cy="140" rx="30" ry="15" fill="url(#darkGreen)" transform="rotate(-25, 185, 140)"/>
  <ellipse cx="170" cy="125" rx="22" ry="11" fill="url(#green)" transform="rotate(-45, 170, 125)"/>
  <!-- Leaf on S -->
  <ellipse cx="340" cy="140" rx="28" ry="14" fill="url(#darkGreen)" transform="rotate(25, 340, 140)"/>
  <ellipse cx="355" cy="125" rx="22" ry="11" fill="url(#green)" transform="rotate(45, 355, 125)"/>
  <!-- Stars decoration -->
  <polygon points="256,45 261,60 276,60 264,69 268,84 256,75 244,84 248,69 236,60 251,60" fill="#2db846" opacity="0.7"/>
  <polygon points="140,75 144,85 154,85 146,91 149,101 140,95 131,101 134,91 126,85 136,85" fill="#2db846" opacity="0.5"/>
  <polygon points="372,75 376,85 386,85 378,91 381,101 372,95 363,101 366,91 358,85 368,85" fill="#2db846" opacity="0.5"/>
  <!-- Decorative line -->
  <line x1="120" y1="320" x2="392" y2="320" stroke="#2db846" stroke-width="2" opacity="0.4"/>
  <!-- DELTA STARS text -->
  <text x="256" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="52" fill="#1a1a1a" letter-spacing="4">DELTA STARS</text>
  <!-- Tagline -->
  <text x="256" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-weight="400" font-size="20" fill="#6b7b6b" letter-spacing="3">PREMIUM QUALITY • FRESH &amp; NATURAL</text>
</svg>
