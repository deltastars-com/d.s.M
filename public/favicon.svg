<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a7a2a"/>
      <stop offset="50%" style="stop-color:#2dba46"/>
      <stop offset="100%" style="stop-color:#1a7a2a"/>
    </linearGradient>
    <linearGradient id="darkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d5c1a"/>
      <stop offset="100%" style="stop-color:#1a8c2e"/>
    </linearGradient>
  </defs>
  
  <!-- White background -->
  <rect width="512" height="512" rx="80" fill="#ffffff"/>
  
  <!-- D letter with leaf -->
  <path d="M130,100 L130,320 Q130,360 170,360 L220,360 Q280,360 280,300 L280,180 Q280,100 220,100 Z" 
        fill="url(#greenGrad)" stroke="#0d5c1a" stroke-width="3"/>
  <ellipse cx="205" cy="230" rx="40" ry="90" fill="#ffffff"/>
  
  <!-- Leaf on D -->
  <ellipse cx="140" cy="80" rx="40" ry="18" fill="url(#darkGreen)" transform="rotate(-25, 140, 80)"/>
  <ellipse cx="125" cy="60" rx="30" ry="14" fill="#2dba46" transform="rotate(-50, 125, 60)"/>
  
  <!-- S letter with leaf -->
  <path d="M300,160 Q300,100 360,100 L400,100 Q430,100 430,140 L430,180 Q430,220 390,220 L340,220 L300,300 Q300,360 350,360 L400,360 Q430,360 430,330" 
        fill="none" stroke="url(#greenGrad)" stroke-width="50" stroke-linecap="round"/>
  
  <!-- Leaf on S -->
  <ellipse cx="420" cy="80" rx="38" ry="17" fill="url(#darkGreen)" transform="rotate(25, 420, 80)"/>
  <ellipse cx="435" cy="60" rx="28" ry="13" fill="#2dba46" transform="rotate(50, 435, 60)"/>
  
  <!-- Left star -->
  <polygon points="80,60 85,75 100,75 88,84 92,100 80,91 68,100 72,84 60,75 75,75" fill="#2dba46"/>
  
  <!-- Right star -->
  <polygon points="432,60 437,75 452,75 440,84 444,100 432,91 420,100 424,84 412,75 427,75" fill="#2dba46"/>
  
  <!-- Decorative line -->
  <line x1="80" y1="380" x2="432" y2="380" stroke="#2dba46" stroke-width="2" opacity="0.5"/>
  
  <!-- DELTA STARS text -->
  <text x="256" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" fill="#1a1a1a" letter-spacing="4">DELTA STARS</text>
  
  <!-- Tagline -->
  <text x="256" y="475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="16" fill="#6b7b6b" letter-spacing="2">PREMIUM HARVEST from SAUDI ARABIA</text>
</svg>
