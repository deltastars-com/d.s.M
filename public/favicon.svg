<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1d0b"/>
      <stop offset="100%" style="stop-color:#1a3a1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4b942"/>
      <stop offset="100%" style="stop-color:#d49b20"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Stars decoration -->
  <polygon points="256,40 261,58 280,58 265,69 270,87 256,76 242,87 247,69 232,58 251,58" fill="url(#gold)" opacity="0.8"/>
  <polygon points="140,70 144,82 156,82 146,89 150,101 140,94 130,101 134,89 124,82 136,82" fill="url(#gold)" opacity="0.6"/>
  <polygon points="372,70 376,82 388,82 378,89 382,101 372,94 362,101 366,89 356,82 368,82" fill="url(#gold)" opacity="0.6"/>
  <!-- DS Text -->
  <text x="256" y="260" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="180" fill="url(#gold)" letter-spacing="-10">DS</text>
  <!-- Leaf accent -->
  <ellipse cx="340" cy="140" rx="28" ry="14" fill="#2d5a27" transform="rotate(-30, 340, 140)"/>
  <ellipse cx="360" cy="125" rx="22" ry="11" fill="#3d7a37" transform="rotate(-45, 360, 125)"/>
  <!-- Bottom line -->
  <line x1="140" y1="320" x2="372" y2="320" stroke="url(#gold)" stroke-width="3" opacity="0.5"/>
  <!-- Text -->
  <text x="256" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="48" fill="url(#gold)" letter-spacing="6">DELTA STARS</text>
  <text x="256" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-weight="400" font-size="22" fill="#8fbc8f" letter-spacing="4">PREMIUM QUALITY</text>
</svg>
