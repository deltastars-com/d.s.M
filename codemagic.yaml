# Codemagic CI/CD Configuration for Delta Stars
# https://codemagic.io

workflows:
  # Android Build (APK + AAB)
  delta-stars-android:
    name: Build Android (APK + AAB)
    max_build_duration: 60
    environment:
      flutter: stable
      node: 20
      vars:
        JAVA_HOME: /opt/homebrew/opt/openjdk@17
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Setup Node.js
        script: |
          npm install -g bun
          bun install
      - name: Build Web App
        script: bun run build
      - name: Setup Android SDK
        script: |
          cd android
          chmod +x gradlew
      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease
      - name: Build AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - info@deltastars-ksa.com
      slack:
        channel: '#builds'
        webhook:
          url: $SLACK_WEBHOOK_URL

  # iOS Build
  delta-stars-ios:
    name: Build iOS (IPA)
    max_build_duration: 60
    environment:
      node: 20
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Setup Node.js
        script: |
          npm install -g bun
          bun install
      - name: Build Web App
        script: bun run build
      - name: Sync iOS
        script: |
          npx cap sync ios
          cd ios/App
          pod install
      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath $PWD/build/App.xcarchive \
            -exportOptionsPlist $PWD/exportOptions.plist \
            -exportPath $PWD/build
    artifacts:
      - ios/App/build/*.ipa
    publishing:
      email:
        recipients:
          - info@deltastars-ksa.com

  # Web Deploy (Netlify/Vercel)
  delta-stars-web:
    name: Deploy Web App
    max_build_duration: 30
    environment:
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Setup Node.js
        script: |
          npm install -g bun
          bun install
      - name: Typecheck
        script: bun tsc -b --noEmit
      - name: Build
        script: bun run build
    artifacts:
      - dist/**/*
