name: Delta Stars E-Commerce - Automated Build System
description: نظام بناء تلقائي كامل لمتجر نجوم دلتا - Complete Automated Build System

# معلومات المشروع
project:
  id: deltastars-ecommerce
  name: Delta Stars E-Commerce
  version: 1.0.0
  description: تطبيق نجوم دلتا للتجارة الإلكترونية - Delta Stars E-Commerce Application
  author: Delta Stars Trading
  email: deltastars777@gmail.com
  phone: "+966 92 002 3204"
  website: https://deltastars.store
  license: MIT
  repository: https://github.com/deltastars-com/D.S.V3

# البيئات المتاحة
environments:
  development:
    name: بيئة التطوير
    description: Development Environment
    branch: develop
    auto_deploy: false
    
  staging:
    name: بيئة الاختبار
    description: Staging/Testing Environment
    branch: staging
    auto_deploy: true
    schedule: "0 12 * * *"  # يومياً الساعة 12 ظهراً
    
  production:
    name: بيئة الإنتاج
    description: Production Environment
    branch: main
    auto_deploy: true
    schedule: "0 2 * * 0"  # أسبوعياً يوم الأحد الساعة 2 صباحاً

# خطوات البناء الكاملة
build:
  # المرحلة 1: التحضير
  prepare:
    name: تحضير البيئة
    description: Prepare Build Environment
    steps:
      - name: تحديث النظام
        command: apt-get update && apt-get upgrade -y
        timeout: 300
        
      - name: تثبيت المتطلبات
        command: |
          apt-get install -y \
          openjdk-11-jdk \
          gradle \
          git \
          curl \
          wget \
          python3 \
          make \
          g++
        timeout: 600
        
      - name: تثبيت Node.js و npm
        command: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
          apt-get install -y nodejs
        timeout: 300

  # المرحلة 2: التثبيت
  install:
    name: تثبيت المكتبات
    description: Install Dependencies
    steps:
      - name: تثبيت npm packages
        command: npm install --legacy-peer-deps
        timeout: 900
        retry: 3
        
      - name: تثبيت Expo CLI
        command: npm install -g expo-cli eas-cli
        timeout: 300
        
      - name: التحقق من التثبيت
        command: npm list && expo --version && eas --version
        timeout: 60

  # المرحلة 3: الفحص والاختبار
  quality:
    name: فحص الجودة والاختبارات
    description: Code Quality & Testing
    steps:
      - name: فحص الكود
        command: npm run lint
        timeout: 300
        optional: true
        
      - name: الاختبارات
        command: npm test
        timeout: 600
        optional: true
        
      - name: فحص الأمان
        command: npm audit
        timeout: 300
        optional: true

  # المرحلة 4: بناء APK
  build_android:
    name: بناء تطبيق Android (APK)
    description: Build Android APK
    steps:
      - name: تسجيل الدخول إلى Expo
        command: |
          eas login --username ${{ secrets.EXPO_USERNAME }} \
                   --password ${{ secrets.EXPO_PASSWORD }}
        timeout: 60
        
      - name: بناء APK
        command: |
          eas build --platform android --type apk \
                   --non-interactive \
                   --wait
        timeout: 1800
        
      - name: تحميل APK
        command: |
          BUILD_ID=$(eas build:list --limit 1 --json | jq -r '.[0].id')
          eas build:download --id $BUILD_ID --path ./build/deltastars.apk
        timeout: 600
        
      - name: توقيع APK
        command: |
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
                   -keystore deltastars.keystore \
                   -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
                   -keypass ${{ secrets.KEY_PASSWORD }} \
                   ./build/deltastars.apk deltastars
        timeout: 300

  # المرحلة 5: بناء IPA
  build_ios:
    name: بناء تطبيق iOS (IPA)
    description: Build iOS IPA
    steps:
      - name: تسجيل الدخول إلى Expo
        command: |
          eas login --username ${{ secrets.EXPO_USERNAME }} \
                   --password ${{ secrets.EXPO_PASSWORD }}
        timeout: 60
        
      - name: بناء IPA
        command: |
          eas build --platform ios --type ipa \
                   --non-interactive \
                   --wait
        timeout: 1800
        
      - name: تحميل IPA
        command: |
          BUILD_ID=$(eas build:list --limit 1 --json | jq -r '.[0].id')
          eas build:download --id $BUILD_ID --path ./build/deltastars.ipa
        timeout: 600

  # المرحلة 6: النشر
  deploy:
    name: نشر التطبيقات
    description: Deploy Applications
    steps:
      - name: نشر على Google Play
        command: |
          echo "Uploading to Google Play Store..."
          # استخدام Google Play Console API
          curl -X POST https://www.googleapis.com/upload/storage/v1/b/deltastars-builds/o \
               -H "Authorization: Bearer ${{ secrets.GOOGLE_PLAY_TOKEN }}" \
               -F "file=@./build/deltastars.apk"
        timeout: 600
        optional: true
        
      - name: نشر على App Store
        command: |
          echo "Uploading to App Store..."
          # استخدام App Store Connect API
          xcrun altool --upload-app \
                      -f ./build/deltastars.ipa \
                      -t ios \
                      -u ${{ secrets.APPLE_ID }} \
                      -p ${{ secrets.APPLE_PASSWORD }}
        timeout: 600
        optional: true

  # المرحلة 7: الإخطارات
  notify:
    name: إرسال الإخطارات
    description: Send Notifications
    steps:
      - name: إخطار Slack
        command: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
               -H 'Content-Type: application/json' \
               -d '{
                 "text": "✅ Delta Stars Build Complete",
                 "attachments": [{
                   "color": "good",
                   "fields": [
                     {"title": "APK", "value": "Ready", "short": true},
                     {"title": "IPA", "value": "Ready", "short": true}
                   ]
                 }]
               }'
        timeout: 60
        optional: true
        
      - name: إخطار البريد الإلكتروني
        command: |
          echo "Build completed successfully" | \
          mail -s "Delta Stars Build Report" \
               support@deltastars.store
        timeout: 60
        optional: true

# الأصول والملفات المُنتجة
artifacts:
  - name: Android APK
    path: ./build/deltastars.apk
    type: apk
    mime_type: application/vnd.android.package-archive
    description: Android Application Package
    
  - name: iOS IPA
    path: ./build/deltastars.ipa
    type: ipa
    mime_type: application/octet-stream
    description: iOS Application Package
    
  - name: Build Report
    path: ./build/build-report.json
    type: json
    description: Build Report
    
  - name: Source Code
    path: ./src
    type: source
    description: Source Code

# المتطلبات والأدوات
requirements:
  system:
    - node: ">=18.0.0"
    - npm: ">=9.0.0"
    - java: ">=11.0.0"
    - gradle: ">=8.0.0"
    
  tools:
    - expo-cli: latest
    - eas-cli: latest
    - docker: ">=20.0.0"
    - git: ">=2.30.0"

# الأسرار والبيانات الحساسة المطلوبة
secrets:
  required:
    - EXPO_USERNAME: "Expo account username"
    - EXPO_PASSWORD: "Expo account password"
    - KEYSTORE_PASSWORD: "Android keystore password"
    - KEY_PASSWORD: "Android key password"
    
  optional:
    - GOOGLE_PLAY_TOKEN: "Google Play API token"
    - GOOGLE_PLAY_SERVICE_ACCOUNT: "Google Play service account JSON"
    - APPLE_ID: "Apple Developer ID"
    - APPLE_PASSWORD: "Apple Developer password"
    - SLACK_WEBHOOK: "Slack webhook URL"
    - GITHUB_TOKEN: "GitHub personal access token"

# الإخطارات والتنبيهات
notifications:
  slack:
    enabled: true
    webhook: ${{ secrets.SLACK_WEBHOOK }}
    channels:
      - "#builds"
      - "#alerts"
    events:
      - build_start
      - build_success
      - build_failure
    
  email:
    enabled: true
    recipients:
      - support@deltastars.store
      - deltastars777@gmail.com
    events:
      - build_failure
      - build_success
    
  webhook:
    enabled: true
    url: https://dudemagic.example.com/webhook/build
    events:
      - build_complete
      - deployment_complete

# الجدولة والتوقيت
schedule:
  # بناء يومي
  daily:
    cron: "0 2 * * *"
    branches:
      - main
      - staging
    description: Daily build at 2 AM UTC
    
  # بناء أسبوعي
  weekly:
    cron: "0 2 * * 0"
    branches:
      - main
    description: Weekly build on Sunday at 2 AM UTC
    
  # بناء شهري
  monthly:
    cron: "0 2 1 * *"
    branches:
      - main
    description: Monthly build on 1st of month at 2 AM UTC

# الخطافات والـ Webhooks
webhooks:
  push:
    - url: https://dudemagic.example.com/webhook/push
      events:
        - push
        - pull_request
      branches:
        - main
        - develop
        - staging
      
  release:
    - url: https://dudemagic.example.com/webhook/release
      events:
        - release
        - tag_push
      
  deployment:
    - url: https://dudemagic.example.com/webhook/deployment
      events:
        - deployment_success
        - deployment_failure

# السياسات والقواعد
policies:
  # سياسة الفروع
  branches:
    main:
      protected: true
      require_reviews: 1
      require_status_checks: true
      auto_merge: false
      
    develop:
      protected: true
      require_reviews: 1
      require_status_checks: true
      auto_merge: false
      
    staging:
      protected: false
      require_reviews: 0
      require_status_checks: false
      auto_merge: true
  
  # سياسة الإصدارات
  releases:
    auto_create: true
    tag_format: "v{version}"
    draft: false
    prerelease: false
    
  # سياسة الأرشفة
  archiving:
    enabled: true
    retention_days: 90
    storage: s3://deltastars-builds

# التكامل مع الخدمات الخارجية
integrations:
  github:
    enabled: true
    owner: deltastars-com
    repo: D.S.V3
    token: ${{ secrets.GITHUB_TOKEN }}
    
  expo:
    enabled: true
    username: ${{ secrets.EXPO_USERNAME }}
    password: ${{ secrets.EXPO_PASSWORD }}
    
  google_play:
    enabled: true
    service_account: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
    package_name: com.deltastars.app
    
  app_store:
    enabled: true
    api_key: ${{ secrets.APP_STORE_API_KEY }}
    team_id: ${{ secrets.APPLE_TEAM_ID }}
    
  slack:
    enabled: true
    webhook: ${{ secrets.SLACK_WEBHOOK }}
    
  docker:
    enabled: true
    registry: docker.io
    image: deltastars:latest

# الإعدادات المتقدمة
advanced:
  # التخزين المؤقت
  cache:
    enabled: true
    ttl: 3600
    storage: redis://cache.example.com:6379
    
  # المراقبة والتسجيل
  monitoring:
    enabled: true
    metrics: true
    logs: true
    tracing: true
    
  # الأداء والتحسينات
  performance:
    parallel_builds: true
    max_concurrent_builds: 2
    build_timeout: 1800
    
  # الأمان والتشفير
  security:
    scan_dependencies: true
    scan_code: true
    encryption: true
    ssl_verify: true
    
  # النسخ الاحتياطي والاستعادة
  backup:
    enabled: true
    frequency: daily
    retention_days: 30
    storage: s3://deltastars-backups

# الإحصائيات والتقارير
reporting:
  enabled: true
  format: json
  storage: s3://deltastars-reports
  
  metrics:
    - build_duration
    - build_success_rate
    - deployment_frequency
    - error_rate
    
  reports:
    - daily: "0 3 * * *"
    - weekly: "0 3 * * 0"
    - monthly: "0 3 1 * *"

# الإصدار والنسخة
version: "1.0.0"
