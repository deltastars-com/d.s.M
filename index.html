  <!-- تسجيل Service Worker + كسر الكاش آلياً -->
  <script>
    (function() {
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js')
            .then(function(reg) {
              console.log('[App] SW registered:', reg.scope);
              
              // Check for updates every 5 minutes
              setInterval(function() {
                reg.update();
              }, 5 * 60 * 1000);
              
              // Listen for new SW waiting
              reg.addEventListener('updatefound', function() {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', function() {
                    if (newWorker.state === 'activated') {
                      // Force page reload for new version
                      if (navigator.serviceWorker.controller) {
                        console.log('[App] New version available, refreshing...');
                        window.location.reload();
                      }
                    }
                  });
                }
              });
            })
            .catch(function(err) {
              console.warn('[App] SW registration failed:', err);
            });
        });
        
        // Reload page when new SW takes over
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
      
      // Version check - compare with server version
      const APP_VERSION = '3.0.0';
      const storedVersion = localStorage.getItem('ds_version');
      if (storedVersion && storedVersion !== APP_VERSION) {
        console.log('[App] Version changed:', storedVersion, '->', APP_VERSION);
        localStorage.setItem('ds_version', APP_VERSION);
        // Clear old caches
        if ('caches' in window) {
          caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
        }
        // Reload for fresh version
        window.location.reload();
      }
      localStorage.setItem('ds_version', APP_VERSION);
    })();
  </script>

  <!-- إدارة شاشة الإقلاع + الإصلاح الذاتي -->
  <script>
    (function () {
      var splash = document.getElementById('ds-splash');
      var root = document.getElementById('root');
      var ready = false;
      var MIN_SHOW = 400;
      var HARD_CAP = 8000;
      var t0 = Date.now();

      function hide() {
        if (!splash) return;
        var wait = Math.max(0, MIN_SHOW - (Date.now() - t0));
        setTimeout(function () {
          splash.classList.add('ds-hide');
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            document.documentElement.setAttribute('data-app-ready', '1');
          }, 550);
        }, wait);
      }

      window.__dsAppReady = function () { if (!ready) { ready = true; hide(); } };

      if (root && 'MutationObserver' in window) {
        var mo = new MutationObserver(function () {
          if (root.children.length && (root.textContent || '').trim().length > 0) {
            mo.disconnect();
            if (!ready) { ready = true; hide(); }
          }
        });
        mo.observe(root, { childList: true, subtree: true });
      }

      setTimeout(function () { if (!ready) { ready = true; hide(); } }, HARD_CAP);

      // الإصلاح الذاتي: عند تلف ملفات البناء (chunk 404 / mismatch)
      window.addEventListener('error', function (e) {
        var f = ((e.filename || '') + '');
        var m = (((e.message || '') + '')).toLowerCase();
        var chunkFail = f.indexOf('/assets/') > -1 ||
                        m.indexOf('failed to fetch dynamically imported') > -1 ||
                        m.indexOf('loading chunk') > -1 ||
                        m.indexOf('importing a module script failed') > -1;
        if (chunkFail && !sessionStorage.getItem('ds_recovered')) {
          sessionStorage.setItem('ds_recovered', '1');
          try {
            if ('caches' in window) caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); });
            if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
          } catch(_) {}
          setTimeout(function(){ window.location.reload(); }, 400);
        }
      }, true);

      // نبضة نشاط للتطبيق (يوقفها App.tsx بعد المونتاج)
      window.dispatchEvent(new CustomEvent('ds-html-loaded', { detail: { at: t0 } }));
    })();
  </script>
