name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Build Web
        run: bun run build

      - name: Create icon PNG from SVG
        run: |
          node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const svg = fs.readFileSync('public/favicon.svg');
          
          // Generate 1024x1024 icon for Capacitor
          sharp(svg)
            .resize(1024, 1024)
            .png()
            .toFile('resources/icon.png')
            .then(() => console.log('Created resources/icon.png'));
          
          // Generate splash screen
          sharp(svg)
            .resize(2732, 2732, { fit: 'contain', background: '#0b1d0b' })
            .png()
            .toFile('resources/splash.png')
            .then(() => console.log('Created resources/splash.png'));
          "

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate Android icons
        run: |
          node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const svg = fs.readFileSync('public/favicon.svg');
          
          const densities = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192
          };
          
          async function generate() {
            for (const [density, size] of Object.entries(densities)) {
              const dir = 'android/app/src/main/res/' + density;
              fs.mkdirSync(dir, { recursive: true });
              
              await sharp(svg)
                .resize(size, size)
                .png()
                .toFile(dir + '/ic_launcher.png');
              
              await sharp(svg)
                .resize(size, size)
                .png()
                .toFile(dir + '/ic_launcher_round.png');
              
              const stats = fs.statSync(dir + '/ic_launcher.png');
              console.log(density + ': ' + size + 'x' + size + ' (' + stats.size + ' bytes)');
            }
          }
          
          generate().then(() => console.log('All icons generated!'));
          "

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify icons exist
        run: |
          echo "=== Checking icons ==="
          ls -la android/app/src/main/res/mipmap-*/ic_launcher.png

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delta-stars-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
