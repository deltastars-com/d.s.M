name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Build Web
        run: bun run build

      - name: Remove old Android directory
        run: rm -rf android

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate proper icons
        run: |
          # Copy icon.png to proper location for capacitor assets
          mkdir -p resources
          cp public/icon.png resources/icon.png
          cp public/splash.png resources/splash.png
          
          # Run capacitor assets to generate all icon sizes
          npx cap assets android || echo "Assets generation completed with warnings"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delta-stars-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
