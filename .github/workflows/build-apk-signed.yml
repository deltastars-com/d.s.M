name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Build Web
        run: bun run build

      - name: Remove old Android directory
        run: rm -rf android

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate and copy official icons AFTER sync
        run: |
          node -e "
          const { createCanvas } = require('canvas');
          const fs = require('fs');
          const path = require('path');
          
          function drawOfficialIcon(ctx, size) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);
            const fontSize = Math.round(size * 0.42);
            ctx.font = 'bold italic ' + fontSize + 'px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const gradient = ctx.createLinearGradient(size * 0.15, 0, size * 0.85, size);
            gradient.addColorStop(0, '#1a8c2e');
            gradient.addColorStop(0.3, '#2db846');
            gradient.addColorStop(0.6, '#1a8c2e');
            gradient.addColorStop(1, '#0d5c1a');
            ctx.fillStyle = gradient;
            ctx.fillText('DS', size / 2, size * 0.40);
            ctx.fillStyle = '#2db846';
            const starSize = size * 0.04;
            ctx.beginPath();
            ctx.arc(size * 0.25, size * 0.15, starSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(size * 0.75, size * 0.15, starSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#2db846';
            ctx.lineWidth = size * 0.008;
            ctx.beginPath();
            ctx.moveTo(size * 0.2, size * 0.58);
            ctx.lineTo(size * 0.8, size * 0.58);
            ctx.stroke();
            const titleSize = Math.round(size * 0.09);
            ctx.font = '800 ' + titleSize + 'px Arial, sans-serif';
            ctx.fillStyle = '#1a1a1a';
            ctx.fillText('DELTA STARS', size / 2, size * 0.68);
            const tagSize = Math.round(size * 0.035);
            ctx.font = '400 ' + tagSize + 'px Arial, sans-serif';
            ctx.fillStyle = '#6b7b6b';
            ctx.fillText('PREMIUM QUALITY', size / 2, size * 0.78);
          }
          
          const sizes = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192
          };
          
          const dir = 'android/app/src/main/res';
          
          for (const [density, size] of Object.entries(sizes)) {
            const canvas = createCanvas(size, size);
            const ctx = canvas.getContext('2d');
            drawOfficialIcon(ctx, size);
            const buf = canvas.toBuffer('image/png');
            ['ic_launcher.png', 'ic_launcher_round.png'].forEach(f => {
              fs.writeFileSync(path.join(dir, density, f), buf);
            });
          }
          
          const fg = createCanvas(432, 432);
          drawOfficialIcon(fg.getContext('2d'), 432);
          fs.writeFileSync(path.join(dir, 'mipmap-xxxhdpi/ic_launcher_foreground.png'), fg.toBuffer('image/png'));
          
          console.log('Official icons copied');
          "

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ github.ref_name }}
          name: "Delta Stars ${{ github.ref_name }}"
          body: |
            ## Delta Stars ${{ github.ref_name }}
            ### Downloads:
            - **APK** (ready to install): `app-debug.apk`
            ### Installation:
            1. Download the APK file
            2. Open it on your Android device
            3. Tap "Install"
            **Owner:** Ali Aldahan (deltastars777@gmail.com)
          files: |
            android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delta-stars-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
