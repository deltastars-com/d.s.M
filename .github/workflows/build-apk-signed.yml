name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Build Web
        run: bun run build

      - name: Remove old Android directory
        run: rm -rf android

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android icons AFTER sync
        run: |
          node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const svg = fs.readFileSync('public/favicon.svg');
          
          const densities = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192
          };
          
          async function generate() {
            for (const [density, size] of Object.entries(densities)) {
              const dir = 'android/app/src/main/res/' + density;
              
              await sharp(svg)
                .resize(size, size)
                .png()
                .toFile(dir + '/ic_launcher.png');
              
              await sharp(svg)
                .resize(size, size)
                .png()
                .toFile(dir + '/ic_launcher_round.png');
              
              const stats = fs.statSync(dir + '/ic_launcher.png');
              console.log(density + ': ' + size + 'x' + size + ' (' + stats.size + ' bytes)');
            }
          }
          
          generate().then(() => console.log('Icons generated!'));
          "

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ github.ref_name }}
          name: "Delta Stars ${{ github.ref_name }}"
          body: |
            ## Delta Stars ${{ github.ref_name }}
            
            ### Downloads:
            - **APK** (ready to install): `app-debug.apk`
            
            ### Installation:
            1. Download the APK file
            2. Open it on your Android device
            3. Tap "Install"
            4. If prompted, enable "Install from unknown sources"
            
            **Owner:** Ali Aldahan (deltastars777@gmail.com)
          files: |
            android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delta-stars-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
