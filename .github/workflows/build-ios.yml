name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Web
        run: bun run build

      - name: Remove old iOS directory
        run: rm -rf ios

      - name: Add iOS Platform
        run: npx cap add ios

      - name: Copy icons to iOS
        run: |
          # Generate app icons for iOS
          node -e "
          const { createCanvas } = require('canvas');
          const fs = require('fs');
          const path = require('path');
          
          function generateIcon(size) {
            const canvas = createCanvas(size, size);
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);
            const fontSize = Math.round(size * 0.39);
            ctx.font = 'bold italic ' + fontSize + 'px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const gradient = ctx.createLinearGradient(size * 0.2, 0, size * 0.8, size);
            gradient.addColorStop(0, '#1a8c2e');
            gradient.addColorStop(0.5, '#2db846');
            gradient.addColorStop(1, '#1a8c2e');
            ctx.fillStyle = gradient;
            ctx.fillText('DS', size / 2, size * 0.45);
            const titleSize = Math.round(size * 0.08);
            ctx.font = '800 ' + titleSize + 'px Arial, sans-serif';
            ctx.fillStyle = '#1a1a1a';
            ctx.fillText('DELTA STARS', size / 2, size * 0.75);
            return canvas.toBuffer('image/png');
          }
          
          const iconSizes = [
            { size: 20, name: 'icon-20.png' },
            { size: 29, name: 'icon-29.png' },
            { size: 40, name: 'icon-40.png' },
            { size: 58, name: 'icon-58.png' },
            { size: 60, name: 'icon-60.png' },
            { size: 76, name: 'icon-76.png' },
            { size: 80, name: 'icon-80.png' },
            { size: 87, name: 'icon-87.png' },
            { size: 120, name: 'icon-120.png' },
            { size: 152, name: 'icon-152.png' },
            { size: 167, name: 'icon-167.png' },
            { size: 180, name: 'icon-180.png' },
            { size: 1024, name: 'icon-1024.png' }
          ];
          
          const assetsDir = 'ios/App/App/Assets.xcassets/AppIcon.appiconset';
          fs.mkdirSync(assetsDir, { recursive: true });
          
          let images = [];
          for (const icon of iconSizes) {
            const buffer = generateIcon(icon.size);
            fs.writeFileSync(path.join(assetsDir, icon.name), buffer);
            images.push({
              size: icon.size + 'x' + icon.size,
              idiom: 'universal',
              filename: icon.name,
              scale: icon.size <= 60 ? '1x' : icon.size <= 180 ? '2x' : '3x'
            });
            console.log('Generated ' + icon.name + ' (' + icon.size + 'x' + icon.size + ')');
          }
          
          // Write Contents.json
          const contents = {
            images: images,
            info: {
              version: 1,
              author: 'xcode'
            }
          };
          fs.writeFileSync(path.join(assetsDir, 'Contents.json'), JSON.stringify(contents, null, 2));
          console.log('Written Contents.json');
          "

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Build iOS App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            archive

      - name: Create IPA
        run: |
          cd ios/App
          mkdir -p build/ipa
          cp -r build/App.xcarchive/Products/Applications/App.app build/ipa/
          cd build/ipa
          zip -r ../delta-stars.ipa App.app

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ github.ref_name }}
          name: "Delta Stars ${{ github.ref_name }} (iOS)"
          body: |
            ## Delta Stars ${{ github.ref_name }} - iOS
            
            ### Downloads:
            - **IPA** (iOS App): `delta-stars.ipa`
            
            ### Installation:
            
            **For Development:**
            1. Download the IPA file
            2. Open with Xcode or Apple Configurator
            3. Install on your iOS device
            
            **For Ad Hoc Distribution:**
            1. Download the IPA file
            2. Upload to Apple Developer Portal
            3. Distribute via TestFlight or MDM
            
            **Note:** Requires Apple Developer account for device installation.
            
            **Owner:** Ali Aldahan (deltastars777@gmail.com)
          files: |
            ios/App/build/delta-stars.ipa
          draft: false
          prerelease: false

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: delta-stars-ipa
          path: ios/App/build/delta-stars.ipa
          retention-days: 30
