name: Build Android APK & iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Build Web
        run: bun run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delta-stars-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: delta-stars-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Web
        run: bun run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build IPA
        run: |
          cd ios
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive

      - name: Export IPA
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: delta-stars-ipa
          path: ios/build/export/*.ipa
          retention-days: 30

  create-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: delta-stars-apk
          path: artifacts/android

      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: delta-stars-aab
          path: artifacts/android

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: delta-stars-ipa
          path: artifacts/ios

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Delta Stars ${{ github.ref_name }}"
          body: |
            ## 🎉 Delta Stars ${{ github.ref_name }}
            
            ### 📱 Downloads:
            
            #### Android:
            - **APK** (للتجربة): `delta-stars.apk`
            - **AAB** (لمتجر Google Play): `delta-stars.aab`
            
            #### iOS:
            - **IPA** (لمتجر App Store): `delta-stars.ipa`
            
            ### 📋 Installation:
            
            **Android APK:**
            1. حمّل ملف APK
            2. افتح الملف على جهاز Android
            3. اضغط "تثبيت"
            
            **Android AAB:**
            1. ارفع الملف على Google Play Console
            2. اتبع خطوات النشر
            
            **iOS IPA:**
            1. استخدم Xcode أو TestFlight
            2. ارفع الملف على App Store Connect
            
            ### ✅ What's New:
            - تحسينات الأداء
            - إصلاح الأخطاء
            - ميزات جديدة
            
            ### 🔒 Security:
            - تشفير AES-GCM
            - حماية CSRF
            - مصادقة بيومترية
            
            **المالك: علي الدحان (Ali Aldahan)**
          files: |
            artifacts/android/*
            artifacts/ios/*
          draft: false
          prerelease: false
