name: Build APK & IPA

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Expo CLI
        run: npm install -g eas-cli

      - name: Verify EXPO_TOKEN secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "❌ EXPO_TOKEN not set"
            exit 1
          fi
          echo "✅ EXPO_TOKEN present"

      - name: Login to Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas login --token $EXPO_TOKEN

      - name: Build APK
        run: eas build --platform android --type apk --non-interactive

      - name: Download APK
        run: |
          BUILD_ID=$(eas build:list --limit 1 --json | jq -r '.[0].id')
          eas build:download --id $BUILD_ID --path ./deltastars.apk

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deltastars-apk
          path: ./deltastars.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ./deltastars.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Expo CLI
        run: npm install -g eas-cli

      - name: Verify EXPO_TOKEN secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "❌ EXPO_TOKEN not set"
            exit 1
          fi
          echo "✅ EXPO_TOKEN present"

      - name: Login to Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas login --token $EXPO_TOKEN

      - name: Build IPA
        run: eas build --platform ios --type ipa --non-interactive

      - name: Download IPA
        run: |
          BUILD_ID=$(eas build:list --limit 1 --json | jq -r '.[0].id')
          eas build:download --id $BUILD_ID --path ./deltastars.ipa

      - name: Upload IPA to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deltastars-ipa
          path: ./deltastars.ipa

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ./deltastars.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
